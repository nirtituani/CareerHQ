[project]
name = "careerhq"
version = "0.1.0"
description = "CareerHQ backend — AI-powered career intelligence platform"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "alembic>=1.19,<1.20",
    "psycopg[binary,pool]>=3.3,<3.4",
    # [email] pulls in email-validator, required by EmailStr in the API schemas.
    "pydantic[email]>=2.13,<2.14",
    "pydantic-settings>=2.14,<2.15",
    "authlib>=1.7,<1.8",
    "pyjwt>=2.13,<3.0",
    "itsdangerous>=2.2,<3.0",
    "redis>=8.1,<8.2",
    "boto3>=1.43,<2.0",
    "httpx>=0.28,<0.29",
    # -- Slice 003 ---------------------------------------------------------
    # The AI gateway. Only infrastructure/ai/litellm_gateway.py may import it —
    # asserted by a test, because Principle V holds as a property of the import
    # graph rather than as a rule someone remembers.
    "litellm>=1.96,<1.97",
    # Document text extraction. pdfplumber and python-docx are both MIT.
    # PyMuPDF is the better extractor and is deliberately NOT used: it is
    # dual-licensed AGPL-3.0 or commercial, which is a real obligation for a
    # deployed web application and not a choice to make accidentally
    # (specs/003-data-foundation/research.md R4).
    "pdfplumber>=0.11.10,<0.12",
    "python-docx>=1.2,<1.3",
    # Multipart form parsing, required by FastAPI for file uploads. Not a
    # direct import anywhere — FastAPI reaches for it when a route declares an
    # UploadFile, and the failure without it is a runtime error at request time
    # rather than at import.
    "python-multipart>=0.0.32,<0.1",
    # -- Slice 005 ---------------------------------------------------------
    # The agent runtime. LangGraph orchestrates the tailoring workflow and
    # owns nothing else: persistence, business state, audit and ownership stay
    # in CareerHQ, and every model call goes through `application/ports.py`
    # rather than through a LangChain model binding
    # (specs/005-resume-tailoring/contracts/tailoring-workflow.md O1-O2).
    #
    # `langgraph-checkpoint` arrives transitively and is unavoidable — it
    # carries the in-memory saver the runtime itself needs. What is
    # deliberately ABSENT is `langgraph-checkpoint-postgres`, which is a
    # separate package and is not installed: it would create a second
    # persistent representation of a workflow whose state CareerHQ already
    # owns, leaving no answer to which one is authoritative. Approval starts
    # no further graph execution, so durable pause/resume has no requirement
    # behind it here (research.md R1, design §3.2). Adding it is a decision,
    # not a convenience.
    #
    # `langchain-core` also arrives transitively. It is permitted; the
    # provider bindings are not, and `tests/unit/test_architecture.py` forbids
    # them by name.
    "langgraph>=1.2.11,<1.3",
    # -- Slice 006 ---------------------------------------------------------
    # Local embeddings over ONNX. Apache-2.0 (the PyPI "Other/Proprietary"
    # classifier is mis-set upstream and contradicted by the repository's own
    # LICENSE file); the default model `BAAI/bge-small-en-v1.5` is MIT and
    # emits 384 dimensions, which is what `vector(384)` was sized for.
    #
    # `sentence-transformers` is deliberately NOT used, despite being the
    # obvious choice and what `embedding_model` originally named. It pulls
    # `torch`, whose cp312 manylinux wheel is 527 MB, roughly doubling a
    # backend image that already measures 1.01 GB — for a component whose
    # whole job is turning ~35 short rules and one query into vectors. The
    # fastembed model is 67 MB. Same dimension, same port, no schema change
    # (spec.md D3, and the T001 blocker report).
    "fastembed>=0.8,<0.9",
    # The SQLAlchemy binding for the `vector` column type. The extension has
    # been enabled in the database since migration 0001; this is the Python
    # side, and without it the Vector() column type does not exist. Zero
    # dependencies of its own.
    "pgvector>=0.5,<0.6",
    # PDF rendering. BSD-3, no browser binary — the template stays reviewable
    # HTML/CSS. NOT pure Python: it binds Pango/Cairo/GObject through cffi, so
    # the image needs libpango-1.0-0, libpangoft2-1.0-0, libharfbuzz0b and
    # libcairo2, and macOS dev needs `brew install pango`. A missing native
    # library fails at IMPORT, not at render (T049). Chosen over ReportLab (template becomes
    # imperative Python nobody reviews as a design) and headless Chrome
    # (hundreds of MB and a flaky CI dependency). Same licensing discipline
    # that rejected PyMuPDF above (spec.md D7).
    "weasyprint>=69,<70",
    # Corpus front-matter (T025). The corpus README specifies YAML front-matter,
    # so it is parsed with a YAML parser rather than approximated with regex —
    # a hand parser silently mis-reads quoting, lists and anything multi-line.
    # Already present transitively via langchain-core and huggingface_hub;
    # declared because depending on somebody else's dependency tree is how a
    # working install breaks on an unrelated upgrade.
    "pyyaml>=6.0,<7.0",
    # Corpus chunk token counts (T025). `knowledge_chunks.token_count` exists so
    # the FR-014 ceiling can be enforced without re-tokenising every candidate,
    # which requires the count to be stable and computed once at ingestion.
    #
    # cl100k_base is an APPROXIMATION of Anthropic's tokenizer, not a match.
    # That is acceptable and the reason is worth stating: the ceiling is a cost
    # and latency budget, not an API limit, so being a few percent out spends a
    # fraction of a cent — whereas chars/4 is out by considerably more, and the
    # embedding model's WordPiece tokenizer measures a different thing entirely.
    # Also transitive via litellm today, and declared for the same reason as above.
    "tiktoken>=0.13,<0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<9.2",
    "pytest-asyncio>=1.4,<2.0",
    "pytest-cov>=7.1,<8.0",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<2.4",
    # Stubs for the corpus front-matter parser (T025). Without them `mypy --strict`
    # fails on `import yaml` alone; a dev-only dependency because nothing at
    # runtime needs it.
    "types-PyYAML>=6.0,<7.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff — format + lint (T003)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "S",    # flake8-bandit
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert is expected in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]      # hardcoded test credentials are fine
"alembic/versions/*" = ["E501"]   # generated migration lines can be long

# ---------------------------------------------------------------------------
# mypy — strict on application code (T003)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "alembic.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# `weasyprint` ships no `py.typed` (T031). Listed alongside the others rather than
# silenced at the import site, so the set of untyped dependencies stays in one place.
module = ["authlib.*", "boto3.*", "botocore.*", "weasyprint.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest + coverage (T004)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Put src on the path directly rather than relying on the editable install.
# macOS sets the BSD `hidden` flag on .pth files under some conditions, and
# Python 3.12 skips hidden .pth files — which makes a correct-looking editable
# install silently unimportable. This removes that dependency entirely.
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# --cov-fail-under enforces the constitutional gate (Principle VII, SC-007).
# Note this makes `pytest` fail without PostgreSQL: the database tests skip, and
# skipped tests cover nothing. Run the stack, or pass --no-cov for a quick
# unit-only check.
addopts = "--cov=careerhq --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
# The package name, not the path: a path-based source conflicts with the
# editable install's import hook and breaks collection.
source = ["careerhq"]
omit = ["*/alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
