# Railway deployment configuration for the backend service (T001).
#
# Lives here rather than at the repository root because Railway resolves this
# file relative to a service's root directory, and this repository holds two
# services. Keeping it in version control means the deployment is reviewable in
# a diff rather than discoverable only by clicking through a web console.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migrations run here as well as in entrypoint.sh, and the duplication is
# deliberate. The entrypoint keeps local Compose working. This runs once per
# deploy, before the new version is allowed to start — and if it fails, Railway
# does not proceed, so the previous version keeps serving rather than the new
# one crash-looping against a schema it cannot use (research.md R3, FR-021).
# The second run finds nothing to apply; alembic is idempotent.
#
# **Corpus ingestion runs here too, and the explicit `/bin/sh -c` is what makes the `&&`
# mean anything** (T050, OQ-006-C; corrected at T048).
#
# `knowledge_chunks` has to exist before anything writes to it, so the ordering matters —
# but **a bare `&&` in this field does not provide it on Railway.** `preDeployCommand` is
# a *single* command: Railway's own JSON schema types it as a string or a **one-element**
# array, and with `builder = "DOCKERFILE"` there is no shell to interpret an operator, so
# only the first command runs. Railway's documentation says so and their staff give this
# exact remedy — wrap the command in a shell.
#
# **This was not theoretical.** Deployment `75cd8ea` ran with the unwrapped string,
# migrated cleanly `0014 -> 0018`, reported SUCCESS, and **never ran ingestion**: zero
# `careerhq.ingest` log lines and an empty corpus in production, while every health check
# passed. A pre-deploy that silently does half its job is worse than one that fails, which
# is why the wrapper is explicit rather than implied.
#
# **Pre-deploy means once per deploy, not once per replica.** A startup hook is ruled out:
# it would pay a model load on every container start, and two replicas booting together
# race `uq_knowledge_chunks_document_content` — both failures scale with replica count, so
# the configuration that produces them is a scaling change nobody would connect to
# ingestion. It is not in `entrypoint.sh` either: a stale *schema* breaks the application,
# a stale *corpus* does not — retrieval falls back to the static rubric and records that
# it did (FR-009).
#
# Steady state is cheap and measured (T026): an unchanged corpus is 0 rows created, 0
# deleted and **0 embedding calls** — one model load and 79 hash comparisons. The weights
# are baked into the image at build time, so this makes no network call. A failure exits
# non-zero and Railway does not proceed, which is the point: a corpus that failed to load
# must not reach production silently.
preDeployCommand = '/bin/sh -c "alembic upgrade head && python -m careerhq.ingest"'

# Readiness, not liveness. Liveness touches no dependency, so a backend that
# cannot reach Postgres would be declared healthy and take traffic. Railway
# keeps the previous deployment serving until this answers 200, which is what
# makes the deploy zero-downtime — and what makes honest readiness reporting
# load-bearing rather than cosmetic: a dependency wrongly reported as failed
# blocks every deployment (research.md R4, FR-006).
healthcheckPath = "/api/health/ready"
healthcheckTimeout = 300

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
