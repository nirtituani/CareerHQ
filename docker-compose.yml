name: careerhq

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL with pgvector. The pgvector image is required — the `vector`
  # extension is enabled by migration 0001 and stock postgres does not ship it.
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerhq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerhq}
      POSTGRES_DB: ${POSTGRES_DB:-careerhq}
    ports:
      # Bound to 127.0.0.1, not 0.0.0.0. Docker's published ports bypass the host
      # firewall, so the default would put Postgres — with the credentials that
      # `cp .env.example .env` leaves in place — on every network the machine
      # joins. Nothing outside the compose network needs these: the containers
      # reach each other by service name, and the host only needs them for tests.
      # Host ports are configurable so a port already taken by another project
      # is a one-line .env change rather than an edit to this file.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Mounted at /var/lib/postgresql, not /var/lib/postgresql/data. Postgres 18
      # images store data in a major-version subdirectory (18/docker) so that
      # `pg_upgrade --link` can work across versions without crossing a mount
      # boundary. Mounting the old pg17 path makes the image refuse to start
      # rather than silently write somewhere unexpected.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerhq} -d ${POSTGRES_DB:-careerhq}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Creates the bucket, then exits. The backend's readiness probe heads this
  # bucket, so it must exist before the backend starts or a first run reports
  # unhealthy for a reason that looks like a bug.
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-careerhq}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        echo "bucket $$S3_BUCKET ready"

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-careerhq}:${POSTGRES_PASSWORD:-careerhq}@postgres:5432/${POSTGRES_DB:-careerhq}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      BACKEND_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/next.config.ts:/app/next.config.ts
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
