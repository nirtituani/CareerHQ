name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      # The pgvector image, not stock postgres: migration 0001 enables the
      # `vector` extension, and the provisioning tests need real UNIQUE
      # constraints and transaction isolation to mean anything.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: careerhq
          POSTGRES_PASSWORD: careerhq
          POSTGRES_DB: careerhq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careerhq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://careerhq:careerhq@localhost:5432/careerhq_test
      REDIS_URL: redis://localhost:6379/1
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key
      S3_BUCKET: careerhq-test
      SESSION_SECRET: ci-session-secret-only-used-in-continuous-integration
      GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-client-secret

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # **The export tests render real PDFs, so this job needs production's renderer**
      # (T055). WeasyPrint binds Pango, Cairo and HarfBuzz through cffi at *import*, and
      # resolves the family the ATS template names through fontconfig. Which font
      # resolves decides the rendered bytes — measured at T032 as an 8,885-byte document
      # becoming 11,499 when the family changed — so without these the six ATS assertions
      # and the byte-determinism assertion are green against a document production does
      # not produce, and a runner base-image change could alter that silently.
      #
      # The same set is declared in `backend/Dockerfile`, and
      # `test_ci_installs_the_same_render_dependencies_as_the_production_image` asserts
      # the two agree — so dropping one here fails a test rather than quietly changing
      # what every other export assertion runs against. `curl` is deliberately not here:
      # it is the image's healthcheck dependency, not a rendering one.
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libcairo2

      - name: Install
        run: pip install -e ".[dev]"


      # Every check runs even when an earlier one failed, so a push surfaces all
      # the problems at once rather than one per round trip. The job still fails.
      - name: Format
        if: '!cancelled()'
        run: ruff format --check .

      - name: Lint
        if: '!cancelled()'
        run: ruff check .

      - name: Type check
        if: '!cancelled()'
        run: mypy src

      # Runs last: a type error should be reported as a type error, not as a
      # confusing test failure downstream of it.
      - name: Tests
        if: '!cancelled()'
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # oxlint rather than ESLint: typescript-eslint refuses to run against
      # TypeScript 7, and eslint-config-next imports it at load time. oxlint
      # parses TypeScript natively and still enforces the rules of hooks.
      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Type check
        if: '!cancelled()'
        run: npm run typecheck

      - name: Tests
        if: '!cancelled()'
        run: npm test

      - name: Build
        if: '!cancelled()'
        run: npm run build
        env:
          BACKEND_URL: http://backend:8000

  # Playwright is not run here. It exercises the full stack — proxy, backend,
  # database together — so it needs `docker compose up` and real secrets. It is
  # part of the per-slice verification step instead, run locally against the
  # live stack. Revisit if the deployment slice makes a disposable environment
  # cheap to stand up.
